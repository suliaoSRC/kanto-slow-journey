name: Publish Kanto Slow Journey

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify travel and game data
        run: node tests/journey.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publish:
    if: ${{ !github.event.repository.private || vars.ENABLE_PRIVATE_PAGES == 'true' }}
    needs: verify
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the static game
        id: deployment
        uses: actions/deploy-pages@v4
